# Broker MQTT del peaje. Los archivos passwd y acl los genera mosquitto/entrypoint.sh
# a partir de las variables MQTT_* del .env cada vez que arranca el contenedor.

listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/data/acl

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
